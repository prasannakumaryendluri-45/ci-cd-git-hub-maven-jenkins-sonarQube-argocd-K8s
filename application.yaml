apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: java-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/prasannakumaryendluri-45/ci-cd-git-hub-maven-jenkins-sonarQube-argocd-K8s.git
    targetRevision: HEAD
    path: java-app-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
